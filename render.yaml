services:
  - type: web
    name: hearttone-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JIOSAAVN_API
        value: https://saavn.sumit.co/api
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: hearttone-backend
          property: host
